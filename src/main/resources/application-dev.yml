server:
  port: 8080

spring:
  application:
    name: referrals-gateway

  config:
    enabled: false #import: optional:configserver  # evita error si Config Server no está disponible

  cloud:
    compatibility-verifier:
      enabled: false               # desactiva la verificación de compatibilidad Boot/Cloud

    netflix:
      eureka:
        client:
          service-url:
            defaultZone: http://localhost:8761/
          register-with-eureka: true
          fetch-registry: true

    gateway:
      routes:
        - id: serv-admin
          uri: http://localhost:8018
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
          #filters:
           # - name: RequestRateLimiter
 #               redis-rate-limiter.replenishRate: 6
#
   #             redis-rate-limiter.burstCapacity: 6
